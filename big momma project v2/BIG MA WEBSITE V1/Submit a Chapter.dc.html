<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0B0705; }
  a { color:#C9A227; text-decoration:none; }
  a:hover { color:#F0D98C; }
  input, select, textarea { font-family:'EB Garamond',Georgia,serif; }
  input::placeholder, textarea::placeholder { color:rgba(232,215,182,.35); font-style:italic; }
  select option { background:#1B100A; color:#E8D7B6; }
</style>
</helmet>

<div style="font-family:'EB Garamond',Georgia,serif;background:#0B0705;color:#E8D7B6;min-height:100vh;box-sizing:border-box;padding:20px 4vw 64px">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:12px;border-bottom:1px solid rgba(201,162,39,.18);font-family:'Cinzel',serif;font-size:15px;letter-spacing:.2em;white-space:nowrap">
    <a href="Magnolia Book Landing.dc.html" style="letter-spacing:.3em;color:#C9A227;font-size:15px">&#8592; HOME</a>
    <div style="display:flex;gap:20px;color:rgba(232,215,182,.55)">
      <a href="Magnolia Book Landing.dc.html" style="color:rgba(232,215,182,.55)">CHAPTERS</a>
      <a href="Photo Album.dc.html" style="color:rgba(232,215,182,.55)">PHOTO ALBUM</a>
        <span style="color:#F0D98C">SUBMIT A CHAPTER</span>
    </div>
  </div>

  <div style="max-width:1020px;margin:44px auto 0;text-align:center">
    <div style="font-family:'Cinzel',serif;font-weight:900;font-size:clamp(24px,3.6vw,52px);letter-spacing:.05em;color:#F0D98C;text-shadow:0 3px 0 #8A6A1F,0 8px 22px rgba(0,0,0,.85)">SUBMIT A CHAPTER</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px">
      <div style="height:1px;width:min(160px,16vw);background:linear-gradient(90deg,rgba(201,162,39,0),rgba(232,197,92,.8))"></div>
      <div style="font-family:'Pinyon Script',cursive;font-size:clamp(22px,2.4vw,34px);color:#C9A227;line-height:1">Tell us about your mother or father</div>
      <div style="height:1px;width:min(160px,16vw);background:linear-gradient(90deg,rgba(232,197,92,.8),rgba(201,162,39,0))"></div>
    </div>
  </div>

  <div style="max-width:1020px;margin:34px auto 0;padding:34px clamp(22px,4vw,54px) 40px;box-sizing:border-box;border-radius:4px;background:linear-gradient(155deg,#241610 0%,#150C07 55%,#1F130D 100%);box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 0 0 1px rgba(201,162,39,.45);position:relative">
    <div style="position:absolute;inset:0;opacity:.35;border-radius:4px;background-image:radial-gradient(rgba(201,162,39,.10) 1px,rgba(0,0,0,0) 1px);background-size:5px 5px;pointer-events:none"></div>

    <div style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 26px">
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">YOUR NAME</span>
        <input type="text" name="name" style="padding:11px 12px;font-size:17px;color:#F0D98C;background:rgba(240,217,140,.06);border:1px solid rgba(201,162,39,.4);border-radius:2px;outline:none" style-focus="border-color:#F0D98C;background:rgba(240,217,140,.12)">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">EMAIL</span>
        <input type="email" name="email" style="padding:11px 12px;font-size:17px;color:#F0D98C;background:rgba(240,217,140,.06);border:1px solid rgba(201,162,39,.4);border-radius:2px;outline:none" style-focus="border-color:#F0D98C;background:rgba(240,217,140,.12)">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">PHONE</span>
        <input type="tel" name="phone" placeholder="(504) 555-0123" style="padding:11px 12px;font-size:17px;color:#F0D98C;background:rgba(240,217,140,.06);border:1px solid rgba(201,162,39,.4);border-radius:2px;outline:none" style-focus="border-color:#F0D98C;background:rgba(240,217,140,.12)">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">WHICH CHILD</span>
        <select name="child" style="padding:11px 12px;font-size:17px;color:#F0D98C;background:rgba(240,217,140,.06);border:1px solid rgba(201,162,39,.4);border-radius:2px;outline:none;appearance:none" style-focus="border-color:#F0D98C;background:rgba(240,217,140,.12)">
          <sc-for list="{{ children }}" as="c" hint-placeholder-count="10">
            <option value="{{ c.value }}">{{ c.label }}</option>
          </sc-for>
        </select>
      </label>
    </div>

    <label style="position:relative;display:flex;flex-direction:column;gap:6px;margin-top:22px">
      <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">THEIR STORY &mdash; PASTE THE ENTIRE NARRATION</span>
      <textarea name="story" rows="14" style="padding:14px;font-size:17.5px;line-height:1.55;color:#F0D98C;background:rgba(240,217,140,.06);border:1px solid rgba(201,162,39,.4);border-radius:2px;outline:none;resize:vertical" style-focus="border-color:#F0D98C;background:rgba(240,217,140,.12)"></textarea>
      <span style="font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:rgba(232,215,182,.6)">Write it however it comes &mdash; we set the type, the drop cap, and the page for you.</span>
    </label>

    <div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:24px;padding:16px 18px;border:1px dashed rgba(201,162,39,.4);border-radius:3px;background:rgba(240,217,140,.04)">
      <div style="flex:1;min-width:220px">
        <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:#C9A227">A PHOTOGRAPH FOR THE FACING PAGE</div>
        <div style="font-family:'EB Garamond',serif;font-style:italic;font-size:14.5px;color:rgba(232,215,182,.65);margin-top:3px">{{ fileLabel }}</div>
      </div>
      <label style="cursor:pointer;padding:11px 24px;border:1px solid rgba(232,197,92,.6);border-radius:2px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.26em;color:#F0D98C;background:rgba(240,217,140,.08)" style-hover="background:rgba(240,217,140,.18)">
        CHOOSE A PHOTO
        <input type="file" accept="image/*" style="display:none" onChange="{{ onFile }}">
      </label>
    </div>

    <div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;margin-top:28px">
      <div style="padding:16px 44px;border:1px solid #8A6A1F;border-radius:2px;font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:.3em;color:#2A1C14;cursor:pointer;background:linear-gradient(180deg,#E8C55C,#C9A227);box-shadow:0 8px 20px rgba(60,40,10,.35)" style-hover="background:linear-gradient(180deg,#F0D98C,#D8B233)" onClick="{{ submit }}">SEND MY CHAPTER</div>
    </div>
  </div>

  <div style="max-width:1020px;margin:30px auto 0;text-align:center">
    <div style="font-family:'EB Garamond',serif;font-size:26px;color:rgba(232,215,182,.85)">Have ideas or suggestions and need to reach Tyronne?</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px;flex-wrap:wrap;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.16em;color:#F0D98C">
      <a href="tel:9857890096" style="color:#F0D98C">985-789-0096</a>
      <span style="width:5px;height:5px;transform:rotate(45deg);background:#C9A227"></span>
      <a href="mailto:tjengineer@berylize.com" style="color:#F0D98C">tjengineer@berylize.com</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1100}}">
class Component extends DCLogic {
  state = { file: '' };

  onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    this.setState({ file: f ? f.name : '' });
  };

  submit = () => {
    const root = this._root || document;
    const get = (sel) => { const el = root.querySelector(sel); return el ? el.value.trim() : ''; };
    const name = get('input[name="name"]');
    const email = get('input[name="email"]');
    const phone = get('input[name="phone"]');
    const child = get('select[name="child"]');
    const story = get('textarea[name="story"]');
    const body = [
      `Submitted by: ${name}`,
      `Email: ${email}`,
      `Phone: ${phone}`,
      `Chapter for: ${child}`,
      this.state.file ? `Photo to attach: ${this.state.file}` : 'Photo: none attached yet',
      '',
      '--- STORY ---',
      '',
      story
    ].join('\n');
    const url = `mailto:tjengineer@berylize.com?subject=${encodeURIComponent('Robertson Family Chapter \u2014 ' + (child || 'submission'))}&body=${encodeURIComponent(body)}`;
    window.location.href = url;
  };

  componentDidMount() { this._root = document; }

  renderVals() {
    const kids = [
      'Magnolia \u201cBig Ma\u201d Robertson \u2014 Foreword',
      'Ethel Brown \u2014 Chapter 1',
      'Johnny Robertson \u2014 Chapter 2',
      'Mary Robertson \u2014 Chapter 3',
      'Beaulah Robertson \u2014 Chapter 4',
      'Leola Robertson \u2014 Chapter 5',
      'Lydia Robertson \u2014 Chapter 6',
      'Beatrice Robertson \u2014 Chapter 7',
      'Lamar Robertson \u2014 Chapter 8',
      'Susanna Robertson \u2014 Chapter 9'
    ];
    return {
      children: [{ value: '', label: 'Select a child\u2026' }].concat(kids.map(k => ({ value: k, label: k }))),
      fileLabel: this.state.file || 'JPG or PNG \u2014 a portrait, a wedding day, a kitchen table',
      onFile: this.onFile,
      submit: this.submit
    };
  }
}

</script>
</body>
</html>
